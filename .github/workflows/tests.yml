name: tests

# Draait de tests en de stijlcontrole bij elke push en pull request.
# De tests gebruiken nagemaakte data, dus de Kaggle-bestanden zijn niet nodig.
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
